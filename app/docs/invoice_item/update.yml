tags:
  - InvoiceItems
summary: Update an invoice item
description: Updates the fields of an existing invoice item, recalculating the invoice totals automatically.
operationId: updateInvoiceItem
produces:
  - application/json
parameters:
  - in: path
    name: item_id
    type: integer
    required: true
    description: ID of the invoice item to update
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        descripcion:
          type: string
          example: "Consulta médica actualizada"
        cantidad:
          type: number
          format: float
          example: 2
        valorUnitario:
          type: number
          format: float
          example: 60
        impuestos:
          type: number
          format: float
          example: 5
        prestacionId:
          type: integer
          example: 1
responses:
  200:
    description: Invoice item updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Invoice item updated successfully"
        item:
          type: object
          properties:
            id:
              type: integer
              example: 10
            descripcion:
              type: string
              example: "Consulta médica actualizada"
            cantidad:
              type: number
              format: float
              example: 2
            valorUnitario:
              type: number
              format: float
              example: 60
            impuestos:
              type: number
              format: float
              example: 5
            total:
              type: number
              format: float
              example: 125
            prestacionId:
              type: integer
              example: 1
  400:
    description: Validation errors
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Quantity must be greater than 0"
  404:
    description: Invoice item or prestation not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Invoice item not found"