tags:
  - Order Details
summary: Get order details by order
description: Retrieves all order details associated with a specific order.
operationId: getOrderDetailsByOrder
produces:
  - application/json
parameters:
  - in: path
    name: order_id
    type: integer
    required: true
    description: ID of the order
responses:
  200:
    description: List of order details for the specified order
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
          order_id:
            type: integer
          code:
            type: string
          description:
            type: string
          indications:
            type: string
          created_at:
            type: string
          updated_at:
            type: string
  404:
    description: Order not found
  500:
    description: Server error