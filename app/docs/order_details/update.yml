tags:
  - Order Details
summary: Update an existing order detail
description: Updates code, description, or indications of an existing order detail.
operationId: updateOrderDetail
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: detail_id
    type: integer
    required: true
    description: ID of the order detail to update
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        indications:
          type: string
responses:
  200:
    description: Order detail updated successfully
  404:
    description: Order detail not found
  500:
    description: Server error