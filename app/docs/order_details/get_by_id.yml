tags:
  - Order Details
summary: Get order detail by ID
description: Retrieves a single order detail by its ID.
operationId: getOrderDetailById
produces:
  - application/json
parameters:
  - in: path
    name: detail_id
    type: integer
    required: true
    description: ID of the order detail
responses:
  200:
    description: Order detail retrieved successfully
    schema:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        code:
          type: string
        description:
          type: string
        indications:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
  404:
    description: Order detail not found
  500:
    description: Server error