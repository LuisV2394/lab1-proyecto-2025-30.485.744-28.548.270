tags:
  - Order Details
summary: Create a new order detail
description: Creates a new order detail associated with an existing order.
operationId: createOrderDetail
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        order_id:
          type: integer
          example: 10
        code:
          type: string
          example: "LAB001"
        description:
          type: string
          example: "Complete Blood Count"
        indications:
          type: string
          example: "Patient must be fasting"
      required:
        - order_id
        - code
        - description
responses:
  201:
    description: Order detail created successfully
  400:
    description: Missing or invalid input data
  404:
    description: Order not found
  500:
    description: Server error