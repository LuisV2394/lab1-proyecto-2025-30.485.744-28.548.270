tags:
    - Agenda
  summary: Update an existing agenda block
  description: >
    Updates an existing agenda block for a professional within a unit.
    Validates date and time format, foreign keys existence,
    enum values for state and type, capacity > 0,
    prevents time overlap with existing blocks, 
    and prevents exact duplicate blocks.
  parameters:
    - in: path
      name: block_id
      required: true
      type: integer
      description: ID of the block to update
    - in: body
      name: body
      required: true
      schema:
        type: object
        properties:
          professionalId:
            type: integer
            example: 101
          unitId:
            type: integer
            example: 5
          date:
            type: string
            format: date
            example: "2025-12-01"
          start_time:
            type: string
            format: time
            example: "09:00:00"
          end_time:
            type: string
            format: time
            example: "11:00:00"
          state:
            type: string
            enum:
              - AVAILABLE
              - BLOCKED
              - OCCUPIED
            example: AVAILABLE
          type:
            type: string
            enum:
              - CONSULTATION
              - PROCEDURE
              - INTERCONSULTATION
            example: CONSULTATION
          capacity:
            type: integer
            minimum: 1
            example: 2
          notes:
            type: string
            example: "Actualización de la consulta de control"

  responses:
    200:
      description: Agenda block updated successfully
      schema:
        type: object
        properties:
          message:
            type: string
            example: "Bloque actualizado"

    400:
      description: Validation error (invalid, missing, or out-of-range data)
      schema:
        type: object
        properties:
          error:
            type: string
            example: "Tipo de bloque inválido, valores permitidos: CONSULTATION, PROCEDURE, INTERCONSULTATION"

    404:
      description: Related resource or block not found
      schema:
        type: object
        properties:
          error:
            type: string
            example: "Bloque no encontrado"

    409:
      description: Time conflict or exact duplicate block
      schema:
        type: object
        properties:
          error:
            type: string
            example: "El profesional ya tiene un bloque en este horario o ya existe un bloque idéntico"