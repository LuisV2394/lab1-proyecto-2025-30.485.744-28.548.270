tags:
  - Payments
summary: Delete a payment
description: Deletes a payment record from the system.
operationId: deletePayment
parameters:
  - in: path
    name: payment_id
    required: true
    type: integer
    description: ID of the payment
    example: 1
responses:
  200:
    description: Payment deleted successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Payment deleted"
  404:
    description: Payment not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Payment not found"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"