tags:
  - Payments
summary: Get all payments
description: Returns a list of all payments in the system.
operationId: getAllPayments
produces:
  - application/json
responses:
  200:
    description: List of payments
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          invoice_id:
            type: integer
            example: 25
          amount:
            type: number
            example: 150.50
          payment_method:
            type: string
            example: "CARD"
          reference:
            type: string
            example: "TRX123456789"
          paid_at:
            type: string
            example: "2026-01-06T14:30:00"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"