tags:
  - Payments
summary: Create a new payment
description: Registers a new payment associated with an invoice.
operationId: createPayment
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - invoice_id
        - amount
        - payment_method
      properties:
        invoice_id:
          type: integer
          description: ID of the invoice
          example: 25
        amount:
          type: number
          format: float
          description: Amount paid
          example: 150.50
        payment_method:
          type: string
          enum: ["CASH", "CARD", "TRANSFER"]
          description: Payment method
          example: "CARD"
        reference:
          type: string
          description: Payment reference or transaction ID
          example: "TRX123456789"
        paid_at:
          type: string
          format: date-time
          description: Date and time of the payment
          example: "2026-01-06T14:30:00"
responses:
  201:
    description: Payment created successfully
    schema:
      type: object
      properties:
        id:
          type: integer
          example: 1
        invoice_id:
          type: integer
          example: 25
        amount:
          type: number
          example: 150.50
        payment_method:
          type: string
          example: "CARD"
        reference:
          type: string
          example: "TRX123456789"
        paid_at:
          type: string
          example: "2026-01-06T14:30:00"
  400:
    description: Invalid input
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Missing required fields or invalid payment method"
  404:
    description: Invoice not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Invoice not found"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"