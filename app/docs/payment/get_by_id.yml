tags:
  - Payments
summary: Get a payment by ID
description: Returns a single payment by its ID.
operationId: getPaymentById
produces:
  - application/json
parameters:
  - in: path
    name: payment_id
    required: true
    type: integer
    description: ID of the payment
    example: 1
responses:
  200:
    description: Payment found
    schema:
      type: object
      properties:
        id:
          type: integer
          example: 1
        invoice_id:
          type: integer
          example: 25
        amount:
          type: number
          example: 150.50
        payment_method:
          type: string
          example: "CARD"
        reference:
          type: string
          example: "TRX123456789"
        paid_at:
          type: string
          example: "2026-01-06T14:30:00"
  404:
    description: Payment not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Payment not found"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"