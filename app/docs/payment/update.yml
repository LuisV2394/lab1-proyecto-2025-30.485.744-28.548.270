tags:
  - Payments
summary: Update a payment
description: Update an existing payment's details.
operationId: updatePayment
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: payment_id
    required: true
    type: integer
    description: ID of the payment
    example: 1
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        amount:
          type: number
          example: 200.00
        payment_method:
          type: string
          enum: ["CASH", "CARD", "TRANSFER"]
          example: "CASH"
        reference:
          type: string
          example: "TRX987654321"
        paid_at:
          type: string
          format: date-time
          example: "2026-01-07T10:00:00"
responses:
  200:
    description: Payment updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Payment updated"
        id:
          type: integer
          example: 1
  400:
    description: Invalid input
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Invalid payment method or missing fields"
  404:
    description: Payment not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Payment not found"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"