tags:
  - Diagnoses
summary: Get all diagnoses
description: Retrieves a list of all diagnoses.
operationId: getAllDiagnoses
produces:
  - application/json

responses:
  200:
    description: List of diagnoses
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 110
          episode_id:
            type: integer
            example: 25
          code:
            type: string
            example: "J45.9"
          description:
            type: string
            example: "Asthma, unspecified"
          type_diagnoses:
            type: string
            enum: ["PRESUMPTIVE", "DEFINITIVE"]
            example: "PRESUMPTIVE"
          main:
            type: boolean
            example: true
          created_at:
            type: string
            format: date-time
            example: "2026-01-06T12:00:00Z"
          updated_at:
            type: string
            format: date-time
            example: "2026-01-06T12:05:00Z"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"