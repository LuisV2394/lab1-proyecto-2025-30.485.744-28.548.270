tags:
  - Diagnoses
summary: Add a diagnosis to an episode
description: >
  Creates a new diagnosis record associated with a medical episode.
operationId: addDiagnosis
consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - episode_id
        - code
        - description
        - type_diagnoses
      properties:
        episode_id:
          type: integer
          description: ID of the medical episode
          example: 25
        code:
          type: string
          description: Diagnosis code (ICD-10 or custom)
          example: "J45.9"
        description:
          type: string
          description: Human-readable name of the diagnosis
          example: "Asthma, unspecified"
        type_diagnoses:
          type: string
          description: Diagnosis type
          enum: ["PRESUMPTIVE", "DEFINITIVE"]
          example: "PRESUMPTIVE"
        main:
          type: boolean
          description: Flag indicating whether this is the main diagnosis
          example: true

responses:
  201:
    description: Diagnosis added successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Diagnóstico añadido"
        id:
          type: integer
          example: 110

  400:
    description: Invalid input (missing required fields or invalid type_diagnoses)
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Faltan campos obligatorios o type_diagnoses inválido"

  404:
    description: Episode not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "El episodio no existe"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"