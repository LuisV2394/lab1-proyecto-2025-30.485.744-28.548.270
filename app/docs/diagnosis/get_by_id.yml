tags:
  - Diagnoses
summary: Get diagnosis by ID
description: Retrieves a single diagnosis by its ID.
operationId: getDiagnosisById
produces:
  - application/json

parameters:
  - in: path
    name: diagnosis_id 
    required: true
    type: integer
    description: ID of the diagnosis
    example: 110

responses:
  200:
    description: Diagnosis found
    schema:
      type: object
      properties:
        id:
          type: integer
          example: 110
        episode_id:
          type: integer
          example: 25
        code:
          type: string
          example: "J45.9"
        description:
          type: string
          example: "Asthma, unspecified"
        type_diagnoses:
          type: string
          enum: ["PRESUMPTIVE", "DEFINITIVE"]
          example: "PRESUMPTIVE"
        main:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-01-06T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-01-06T12:05:00Z"

  404:
    description: Diagnosis not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Diagnóstico no encontrado"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"