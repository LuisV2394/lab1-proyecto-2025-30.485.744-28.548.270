tags:
  - Diagnoses
summary: Update a diagnosis
description: Updates an existing diagnosis record.
operationId: updateDiagnosis
consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: path
    name: id
    required: true
    type: integer
    description: ID of the diagnosis to update
    example: 110
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        code:
          type: string
          example: "J45.9"
        description:
          type: string
          example: "Asthma, unspecified"
        type_diagnoses:
          type: string
          enum: ["PRESUMPTIVE", "DEFINITIVE"]
          example: "DEFINITIVE"
        main:
          type: boolean
          example: true

responses:
  200:
    description: Diagnosis updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Diagnóstico actualizado"
        id:
          type: integer
          example: 110

  400:
    description: Invalid input
    schema:
      type: object
      properties:
        error:
          type: string
          example: "type_diagnoses inválido. Valores permitidos: ['PRESUMPTIVE','DEFINITIVE']"

  404:
    description: Diagnosis not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Diagnóstico no encontrado"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"