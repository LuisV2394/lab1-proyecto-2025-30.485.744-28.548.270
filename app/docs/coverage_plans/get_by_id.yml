tags:
  - Coverage Plans
summary: Get a coverage plan by ID
description: Retrieves a coverage plan by its ID
operationId: getCoveragePlanById
parameters:
  - in: path
    name: plan_id
    required: true
    schema:
      type: integer
      example: 1
responses:
  200:
    description: Coverage plan retrieved successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Coverage plan retrieved successfully"
        plan:
          type: object
          properties:
            id:
              type: integer
              example: 1
            insurer_id:
              type: integer
              example: 3
            name:
              type: string
              example: "Basic Plan"
            general_conditions:
              type: string
              example: "Covers general consultations"
            created_at:
              type: string
              format: date-time
              example: "2026-01-05T18:00:00Z"
            updated_at:
              type: string
              format: date-time
              example: "2026-01-05T18:00:00Z"
  404:
    description: Coverage plan not found