tags:
- coverage plan
summary: Get a coverage plan by ID
description: Retrieve details of a specific coverage plan by its ID.
operationId: getCoveragePlanById
parameters:
- name: id
  in: path
  required: true
  description: ID of the coverage plan
  schema:
    type: integer
responses:
  200:
    description: Coverage plan details
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            coverage_percentage:
              type: number
              format: float
            max_coverage_amount:
              type: number
              format: float
            active:
              type: boolean
              example: true
  404:
    description: Coverage plan not found
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
  500:
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string