tags:
- coverage plan
summary: Create a new coverage plan
description: Endpoint to create a new coverage plan in the system.
operationId: createCoveragePlan
requestBody:
  description: Coverage plan details
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Name of the coverage plan
          coverage_percentage:
            type: number
            format: float
            description: Percentage of coverage provided by the plan
          max_coverage_amount:
            type: number
            format: float
            description: Maximum coverage amount for the plan
        required:
          - name
          - coverage_percentage
          - max_coverage_amount
responses:
  201:
    description: Coverage plan created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
              description: Unique identifier of the created coverage plan
            name:
              type: string
              description: Name of the coverage plan
            coverage_percentage:
              type: number
              format: float
              description: Percentage of coverage provided by the plan
            max_coverage_amount:
              type: number
              format: float
              description: Maximum coverage amount for the plan
  400:
    description: Invalid input data
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Description of the error
  500:
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              description: Description of the error
              