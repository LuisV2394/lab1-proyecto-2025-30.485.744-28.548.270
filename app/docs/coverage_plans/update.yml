tags:
  - Coverage Plans
summary: Update a coverage plan
description: Updates an existing coverage plan
operationId: updateCoveragePlan
parameters:
  - in: path
    name: plan_id
    required: true
    schema:
      type: integer
      example: 1
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        insurer_id:
          type: integer
          example: 3
        name:
          type: string
          example: "Updated Plan Name"
        general_conditions:
          type: string
          example: "Updated conditions"
responses:
  200:
    description: Coverage plan updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Coverage plan updated successfully"
        plan:
          type: object
          properties:
            id:
              type: integer
              example: 1
            insurer_id:
              type: integer
              example: 3
            name:
              type: string
              example: "Updated Plan Name"
            general_conditions:
              type: string
              example: "Updated conditions"
            created_at:
              type: string
              format: date-time
              example: "2026-01-05T18:00:00Z"
            updated_at:
              type: string
              format: date-time
              example: "2026-01-05T18:30:00Z"
  400:
    description: Invalid input
  404:
    description: Coverage plan not found
  500:
    description: Server error