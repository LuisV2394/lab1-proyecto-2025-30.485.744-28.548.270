tags:
- services
summary: Update an existing service
description: Endpoint to update an existing service by its ID.
operationId: updateService
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: id
    required: true
    type: integer
    format: int64
    description: ID of the service to update
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        name:
          type: string
          example: "Blood Test"
        description:
          type: string
          example: "Comprehensive blood test including CBC and metabolic panel."
        price:
          type: number
          format: float
          example: 99.99
responses:
  200:
    description: Service updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Service updated successfully"
        service:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "Blood Test"
            description:
              type: string
              example: "Comprehensive blood test including CBC and metabolic panel."
            price:
              type: number
              format: float
              example: 99.99
            created_at:
              type: string
              format: date-time
              example: "2026-01-05T14:30:00Z"
  400:
    description: Invalid input
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Invalid input"
  404:
    description: Service not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Service not found"
  500:
    description: Internal server error
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Internal server error"