tags:
  - Services
summary: Update an existing service
description: Updates the information of an existing service
operationId: updateService
parameters:
  - in: path
    name: service_id
    required: true
    type: integer
    description: ID of the service to update
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        code:
          type: string
          example: "LAB001"
        name:
          type: string
          example: "Blood Test"
        group_name:
          type: string
          example: "Laboratory"
        requirements:
          type: string
          example: "Fasting 8 hours"
        estimated_time:
          type: integer
          example: 30
        active:
          type: boolean
          example: true
responses:
  200:
    description: Service updated successfully
    schema:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: "LAB001"
        name:
          type: string
          example: "Blood Test"
        group_name:
          type: string
          example: "Laboratory"
        requirements:
          type: string
          example: "Fasting 8 hours"
        estimated_time:
          type: integer
          example: 30
        active:
          type: boolean
          example: true
  400:
    description: Invalid input
  404:
    description: Service not found