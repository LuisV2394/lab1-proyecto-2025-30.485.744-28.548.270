tags:
 - services
summary: get service by ID
description: Endpoint to retrieve a service by its ID.
operationId: getServiceById
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: id
    required: true
    type: integer
    format: int64
    description: ID of the service to retrieve
responses:
  200:
    description: Service retrieved successfully
    schema:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Blood Test"
        description:
          type: string
          example: "Comprehensive blood test including CBC and metabolic panel."
        price:
          type: number
          format: float
          example: 99.99
        created_at:
          type: string
          format: date-time
          example: "2026-01-05T14:30:00Z"
  404:
    description: Service not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Service not found"
  400:
    description: Invalid ID supplied
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Invalid ID supplied"
  500:
    description: Internal server error
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Internal server error"