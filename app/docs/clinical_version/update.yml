tags:
  - Clinical Versions
summary: Update a clinical version
description: Updates the content of an existing clinical version.
operationId: updateClinicalVersion
consumes:
  - application/json
produces:
  - application/json
parameters:
  - name: version_id
    in: path
    required: true
    type: integer
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        content_snapshot:
          type: string
          example: "Updated snapshot content"
responses:
  200:
    description: Version updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Clinical version updated successfully"
        version:
          type: object
          properties:
            id:
              type: integer
              example: 15
            content_snapshot:
              type: string
              example: "Updated snapshot content"
            version_number:
              type: integer
              example: 2
            created_at:
              type: string
              example: "2026-01-08T14:22:31"
  400:
    description: Invalid input
  404:
    description: Version not found
  401:
    description: Unauthorized
  403:
    description: Forbidden