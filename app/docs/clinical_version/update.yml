tags:
  - Clinical Versions
summary: Update a clinical version
description: Updates the content snapshot of a clinical version. Validates that content is not empty and within length limits.
operationId: updateClinicalVersion
consumes:
  - application/json
produces:
  - application/json
parameters:
  - name: version_id
    in: path
    description: ID of the clinical version to update
    required: true
    type: integer
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        content_snapshot:
          type: string
          description: New snapshot content (required, max 10000 characters)
          example: "Updated snapshot content of the note"
responses:
  200:
    description: Clinical version updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Clinical version updated successfully"
        version:
          type: object
          properties:
            id:
              type: integer
              example: 15
            entity_type:
              type: string
              example: "clinical_note"
            entity_id:
              type: integer
              example: 12
            content_snapshot:
              type: string
              example: "Updated snapshot content of the note"
            user_id:
              type: integer
              example: 5
            version_number:
              type: integer
              example: 2
            created_at:
              type: string
              example: "2026-01-08T14:22:31"
  400:
    description: Invalid content_snapshot
  404:
    description: Clinical version not found
  500:
    description: Server error