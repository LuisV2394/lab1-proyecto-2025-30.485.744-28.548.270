# create a new clinical version
tags:
  - Clinical Versions
summary: Create a new clinical version
description: Endpoint to create a new clinical version in the system.
operationId: createClinicalVersion
requestBody:
  description: Clinical version object that needs to be added
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ClinicalVersion'
responses:
  200:
    description: Clinical version created successfully
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ClinicalVersion'
  400:
    description: Invalid input
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  500:
    description: Server error
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'  