# get history by entidy tipe and entidy id
tags:
  - Clinical Version
summary: Get clinical version history
description: Endpoint to retrieve the history of clinical versions based on entity type and entity ID.
operationId: getClinicalVersionHistory
parameters:
  - name: entity_type
    in: query
    description: Type of the entity (e.g., patient, doctor)
    required: true
    schema:
      type: string
  - name: entity_id
    in: query
    description: ID of the entity
    required: true
    schema:
      type: string
responses:
  200:
    description: Successful retrieval of clinical version history
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ClinicalVersion'
  400:
    description: Invalid input parameters
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  500:
    description: Server error
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'