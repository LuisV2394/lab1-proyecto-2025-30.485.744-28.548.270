tags:
  - Clinical Versions
summary: Get all clinical versions
description: Returns all clinical version records, ordered by creation date descending.
operationId: getAllClinicalVersions
produces:
  - application/json
responses:
  200:
    description: Versions retrieved successfully
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          entity_type:
            type: string
            example: "note"
          entity_id:
            type: integer
            example: 10
          content_snapshot:
            type: string
            example: "Previous note content..."
          user_id:
            type: integer
            example: 5
          version_number:
            type: integer
            example: 2
          created_at:
            type: string
            format: date-time
            example: "2026-01-08T14:22:31"
  401:
    description: Unauthorized
  403:
    description: Forbidden
  500:
    description: Server error