tags:
  - Clinical Versions
summary: Retrieve all clinical versions
description: Retrieves all clinical versions in the system, ordered by creation date descending.
operationId: getAllClinicalVersions
produces:
  - application/json
responses:
  200:
    description: List of clinical versions retrieved successfully
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 15
          entity_type:
            type: string
            example: "clinical_note"
          entity_id:
            type: integer
            example: 12
          content_snapshot:
            type: string
            example: "Snapshot content of the note"
          user_id:
            type: integer
            example: 5
          version_number:
            type: integer
            example: 2
          created_at:
            type: string
            example: "2026-01-08T14:22:31"
  500:
    description: Server error