tags:
  - Clinical Versions
summary: Delete a clinical version
description: Deletes a clinical version by its ID.
operationId: deleteClinicalVersion
produces:
  - application/json
parameters:
  - name: version_id
    in: path
    description: ID of the clinical version to delete
    required: true
    type: integer
responses:
  200:
    description: Clinical version deleted successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Clinical version deleted successfully"
  404:
    description: Clinical version not found
  500:
    description: Server error