tags:
  - Clinical Versions
summary: Delete a clinical version
description: Permanently deletes a clinical version entry.
operationId: deleteClinicalVersion
parameters:
  - name: version_id
    in: path
    required: true
    type: integer
responses:
  200:
    description: Clinical version deleted successfully
  404:
    description: Version not found
  401:
    description: Unauthorized
  403:
    description: Forbidden