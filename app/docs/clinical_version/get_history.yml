tags:
  - Clinical Versions
summary: Retrieve version history by entity
description: Retrieves all versions of a specific entity, ordered by version number descending.
operationId: getClinicalVersionHistory
produces:
  - application/json
parameters:
  - name: entity_type
    in: path
    description: Type of entity (must be one of clinical_note, lab_result, prescription, episode)
    required: true
    type: string
  - name: entity_id
    in: path
    description: ID of the entity
    required: true
    type: integer
responses:
  200:
    description: Version history retrieved successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Version history retrieved successfully"
        count:
          type: integer
          example: 3
        versions:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 15
              entity_type:
                type: string
                example: "clinical_note"
              entity_id:
                type: integer
                example: 12
              content_snapshot:
                type: string
                example: "Snapshot content of the note"
              user_id:
                type: integer
                example: 5
              version_number:
                type: integer
                example: 2
              created_at:
                type: string
                example: "2026-01-08T14:22:31"
  400:
    description: Invalid entity_type or entity_id
  500:
    description: Server error