tags:
  - Clinical Versions
summary: Get version history by entity
description: Returns all previous versions for a specific entity (note, result, prescription, episode).
operationId: getVersionHistoryByEntity
produces:
  - application/json
parameters:
  - name: entity_type
    in: path
    required: true
    type: string
    enum: ["note", "result", "prescription", "episode"]
    example: "note"
  - name: entity_id
    in: path
    required: true
    type: integer
    example: 10
responses:
  200:
    description: Version history retrieved successfully
    schema:
      type: object
      properties:
        count:
          type: integer
          example: 3
        versions:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              content_snapshot:
                type: string
                example: "Previous note content..."
              user_id:
                type: integer
                example: 5
              version_number:
                type: integer
                example: 2
              created_at:
                type: string
                example: "2026-01-08T14:22:31"
  400:
    description: Invalid entity_type
  401:
    description: Unauthorized
  403:
    description: Forbidden