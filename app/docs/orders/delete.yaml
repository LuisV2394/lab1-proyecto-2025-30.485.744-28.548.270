tags:
 - Orders
summary: Delete an order
description: >
  Deletes an existing order record.

operationId: deleteOrder
produces:
 - application/json

parameters:
  - in: path
    name: order_id
    required: true
    type: integer
    description: ID of the order to delete
    example: 101
responses:
  200:
    description: Order deleted successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order deleted successfully"
        id:
          type: integer
          example: 101
  404:
    description: Order not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order not found"
  500:
    description: Server error
    schema:
      type: object
      properties:
        message:
          type: string
          example: "An error occurred while deleting the order"