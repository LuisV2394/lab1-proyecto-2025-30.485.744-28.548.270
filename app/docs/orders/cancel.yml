tags:
  - Orders
summary: Cancel an order
description: Cancels an existing order.
operationId: cancelOrder
produces:
  - application/json
parameters:
  - in: path
    name: order_id
    required: true
    type: integer
responses:
  200:
    description: Order canceled successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order canceled successfully"
  404:
    description: Order not found