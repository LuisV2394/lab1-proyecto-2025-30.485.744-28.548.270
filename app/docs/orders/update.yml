tags:
  - Orders
summary: Update order status
description: Updates the status of an existing order.
operationId: updateOrderStatus
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: order_id
    required: true
    type: integer
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        status:
          type: string
          enum: ["issued", "authorized", "in_progress", "completed", "canceled"]
          example: "in_progress"
responses:
  200:
    description: Order status updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order status updated successfully"
        status:
          type: string
          example: "in_progress"
  400:
    description: Invalid status
  404:
    description: Order not found