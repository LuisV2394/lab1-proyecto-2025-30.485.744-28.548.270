tags:
  - orders
summary: create new order
description: This endpoint allows you to create a new order in the system.
operationId: createOrder
  
consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: body
    name: body
    description: Order data
    required: true
    schema:
      type: object
      required:
        - customer_id
        - items
      properties:
        customer_id:
          type: integer
          description: ID of the customer placing the order
          example: 45
        items:
          type: array
          description: List of items in the order
          items:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: integer
                description: ID of the product
                example: 101
              quantity:
                type: integer
                description: Quantity of the product ordered
                example: 2
responses:
  201:
    description: Order created successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order created successfully"
        order_id:
          type: integer
          example: 1234
  400:
    description: Invalid input
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Invalid order data"
  500:
    description: Server error
    schema:
      type: object
      properties:
        message:
          type: string
          example: "An unexpected error occurred"