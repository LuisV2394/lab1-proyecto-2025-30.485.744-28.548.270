tags:
  - Orders
summary: Get all orders
description: Returns a list of all orders with their details.
operationId: getAllOrders
produces:
  - application/json
responses:
  200:
    description: List of orders
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
          episode_id:
            type: integer
          professional_id:
            type: integer
          requires_authorization:
            type: boolean
          type:
            type: string
          priority:
            type: string
          status:
            type: string
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
          details:
            type: array
            items:
              type: object
              properties:
                code:
                  type: string
                description:
                  type: string
                indications:
                  type: string