tags:
  - Orders
summary: Create a new order
description: Creates a new order record with associated details in the system.
operationId: createOrder
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        episode_id:
          type: integer
          example: 12
        professional_id:
          type: integer
          nullable: true
          example: 5
        requires_authorization:
          type: boolean
          example: false
        type:
          type: string
          enum: ["LABORATORY","IMAGING","PROCEDURE","MEDICATION","OTHER"]
          example: "LABORATORY"
        details:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: "LAB001"
              description:
                type: string
                example: "Complete Blood Count"
              indications:
                type: string
                example: "Fasting required"
        priority:
          type: string
          enum: ["normal", "urgent"]
          example: "normal"
      required:
        - episode_id
        - type
        - details
responses:
  201:
    description: Order created successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order created successfully"
        order_id:
          type: integer
          example: 1
  400:
    description: Invalid input
  500:
    description: Server error