tags:
  - Orders
summary: Get order by ID
description: Retrieves a single order by its ID.
operationId: getOrderById
produces:
  - application/json
parameters:
  - in: path
    name: order_id
    required: true
    type: integer
responses:
  200:
    description: Order found
    schema:
      type: object
      properties:
        id:
          type: integer
        episode_id:
          type: integer
        professional_id:
          type: integer
          nullable: true
        requires_authorization:
          type: boolean
        type:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              description:
                type: string
              instructions:
                type: string
        priority:
          type: string
          enum: ["normal", "urgent"]
        status:
          type: string
          enum: ["issued", "authorized", "in_progress", "completed", "canceled"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  404:
    description: Order not found