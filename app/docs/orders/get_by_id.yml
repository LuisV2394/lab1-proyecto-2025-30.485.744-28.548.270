tags:
  - Orders
summary: Get order by ID
description: Returns a single order and its details.
operationId: getOrderById
produces:
  - application/json
parameters:
  - in: path
    name: order_id
    required: true
    type: integer
responses:
  200:
    description: Order found
    schema:
      type: object
      properties:
        id:
          type: integer
        episode_id:
          type: integer
        professional_id:
          type: integer
        requires_authorization:
          type: boolean
        type:
          type: string
        priority:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        details:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              description:
                type: string
              indications:
                type: string
  404:
    description: Order not found