tags:
 - orders
summary: Get order by ID  
description: >
  Retrieves a single order record by its unique identifier. 

operationId: getOrderById
produces:
 - application/json 

parameters:
  - in: path
    name: order_id
    required: true
    type: integer
    description: ID of the order
    example: 101
responses:
  200:
    description: Order found
    schema:
      type: object
      properties:
        id:
          type: integer
          example: 101
        customer_id:
          type: integer
          example: 45
        order_date:
          type: string
          format: date-time
          example: "2025-12-01T10:15:30Z"
        status:
          type: string
          example: "shipped"
        total_amount:
          type: number
          format: float
          example: 250.75

  404:
    description: Order not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order not found"

  500:
    description: Server error
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Internal server error"