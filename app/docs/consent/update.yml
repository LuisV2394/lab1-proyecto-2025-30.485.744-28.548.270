tags:
  - Consents
summary: Update a consent
description: >
  Updates an existing consent record.
operationId: updateConsent
consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: path
    name: consent_id
    required: true
    type: integer
    description: ID of the consent to update
    example: 88

  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        person_id:
          type: integer
          description: ID of the person providing consent (optional)
          example: 12
        process_type:
          type: string
          description: Type of process for which consent is given (optional)
          example: "data_processing"
        method:
          type: string
          description: Method by which consent was obtained (optional)
          enum:
            - DIGITAL_SIGNATURE
            - VERBAL_WITH_RECORD
          example: DIGITAL_SIGNATURE

responses:
  200:
    description: Consent updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Consentimiento actualizado"
        id:
          type: integer
          example: 88

  404:
    description: Consent not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Consentimiento no encontrado"

  400:
    description: Invalid input
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Invalid data"

  500:
    description: Server error
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Internal server error"