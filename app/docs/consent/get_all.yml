tags:
  - Consents
summary: Get all consents
description: >
  Retrieves a list of all registered consent records.
operationId: getAllConsents
produces:
  - application/json

responses:
  200:
    description: List of consents
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          person_id:
            type: integer
            example: 12
          process_type:
            type: string
            example: "data_processing"
          method:
            type: string
            description: Method by which consent was obtained
            enum:
              - DIGITAL_SIGNATURE
              - VERBAL_WITH_RECORD
            example: DIGITAL_SIGNATURE
          file_id:
            type: string
            description: Auto-generated file identifier associated with the consent PDF
            example: "file_20260105103022_12.pdf"
          date:
            type: string
            format: date-time
            description: Date and time when the consent was registered
            example: "2026-01-05T10:30:22Z"

  500:
    description: Server error
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Internal server error"