tags:
  - Consents
summary: Register a new consent
description: >
  Creates a new consent record for a person.
  Generates an internal file reference associated with the consent document.
operationId: createConsent
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    description: Consent data
    required: true
    schema:
      type: object
      required:
        - person_id
        - process_type
        - method
      properties:
        person_id:
          type: integer
          description: ID of the person providing consent
          example: 12
        process_type:
          type: string
          description: Type of process for which consent is given
          example: "data_processing"
        method:
          type: string
          description: Method by which consent was obtained
          enum:
            - DIGITAL_SIGNATURE
            - VERBAL_WITH_RECORD
          example: DIGITAL_SIGNATURE

responses:
  201:
    description: Consent registered successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Consentimiento registrado"
        id:
          type: integer
          example: 88
        file_reference:
          type: string
          description: Auto-generated file identifier associated with the consent PDF
          example: "file_20260105101530_12.pdf"

  400:
    description: Invalid input (missing required fields)
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Faltan campos obligatorios"

  404:
    description: Person not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "La persona no existe"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"