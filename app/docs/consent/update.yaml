tags:
  -orders

summary: Update an order
description: >
  Updates an existing order record.

operationId: updateOrder
consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: path
    name: order_id
    required: true
    type: integer
    description: ID of the order to update
    example: 101

  - in: body
    name: body 
    required: true
    schema:
      type: object
      properties:
        customer_id:
          type: integer
          example: 45
        order_status:
          type: string
          example: "shipped"
        shipping_method:
          type: string
          enum:
            - standard
            - express
            - overnight
          example: "express"
    
responses:
  200:
    description: Order updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order updated successfully"
        id:
          type: integer
          example: 101
  404:
    description: Order not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order not found"
  500:
    description: Internal server error
    schema:
      type: object
      properties:
        message:
          type: string
          example: "An unexpected error occurred"