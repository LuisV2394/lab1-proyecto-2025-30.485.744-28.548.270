tags:
  - Prescriptions
summary: Get all prescriptions
description: Retrieves a list of all prescriptions in the system.
operationId: getAllPrescriptions
produces:
  - application/json
responses:
  200:
    description: List of prescriptions
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          episode_id:
            type: integer
            example: 12
          items:
            type: array
            items:
              type: object
              properties:
                medicationCode:
                  type: string
                  example: "MED123"
                name:
                  type: string
                  example: "Paracetamol"
                dose:
                  type: string
                  example: "500mg"
                route:
                  type: string
                  example: "oral"
                frequency:
                  type: string
                  example: "TID"
                duration:
                  type: string
                  example: "5 days"
          observations:
            type: string
            example: "Take after meals"
          created_at:
            type: string
            example: "2026-01-05T17:30:00"
          updated_at:
            type: string
            example: "2026-01-05T17:40:00"