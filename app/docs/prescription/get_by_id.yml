tags:
  - Prescriptions
summary: Get prescription by ID
description: Returns a single prescription by its ID.
operationId: getPrescriptionById
parameters:
  - name: prescription_id
    in: path
    required: true
    type: integer
    example: 1
produces:
  - application/json
responses:
  200:
    description: Prescription found
    schema:
      type: object
      properties:
        id:
          type: integer
          example: 1
        episode_id:
          type: integer
          example: 12
        observations:
          type: string
          example: "Take after meals"
        created_at:
          type: string
          format: date-time
          example: "2026-01-06T15:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-01-06T15:30:00Z"
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              medicine_code:
                type: string
                example: "MED123"
              name:
                type: string
                example: "Paracetamol"
              dosage:
                type: string
                example: "500mg"
              route:
                type: string
                example: "oral"
              frequency:
                type: string
                example: "TID"
              duration:
                type: string
                example: "5 days"
              created_at:
                type: string
                format: date-time
                example: "2026-01-06T15:05:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2026-01-06T15:10:00Z"
  404:
    description: Prescription not found