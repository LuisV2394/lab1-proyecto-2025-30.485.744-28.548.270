tags:
  - Prescriptions
summary: Get Prescription by ID
description: Retrieve a prescription by its unique identifier.
operationId: getPrescriptionById
parameters:
  - name: prescriptionId
    in: path
    required: true
    description: The unique identifier of the prescription.
    schema:
      type: string
responses:
  '200':
    description: Successful retrieval of the prescription.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Prescription'
  '404':
    description: Prescription not found.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
  '500':
    description: Internal server error.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'