tags:
  - Prescriptions
summary: Create a new prescription
description: Creates a new prescription record in the system.
operationId: createPrescription
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        episode_id:
          type: integer
          example: 12
        items:
          type: array
          items:
            type: object
            properties:
              medicationCode:
                type: string
                example: "MED123"
              name:
                type: string
                example: "Paracetamol"
              dose:
                type: string
                example: "500mg"
              route:
                type: string
                example: "oral"
              frequency:
                type: string
                example: "TID"
              duration:
                type: string
                example: "5 days"
        observations:
          type: string
          example: "Take after meals"
      required:
        - episode_id
        - items
responses:
  201:
    description: Prescription created successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Prescription created successfully"
        prescription_id:
          type: integer
          example: 1
  400:
    description: Invalid input
  500:
    description: Server error