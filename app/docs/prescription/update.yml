tags:
  - Prescriptions
summary: Update a prescription
description: Updates an existing prescription by its ID.
operationId: updatePrescription
parameters:
  - name: prescription_id
    in: path
    required: true
    type: integer
    example: 1
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              medicine_code:
                type: string
                example: "MED123"
              name:
                type: string
                example: "Paracetamol"
              dosage:
                type: string
                example: "500mg"
              route:
                type: string
                example: "oral"
              frequency:
                type: string
                example: "TID"
              duration:
                type: string
                example: "5 days"
        observations:
          type: string
          example: "Take after meals"
produces:
  - application/json
responses:
  200:
    description: Prescription updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Prescription updated successfully"
        prescription_id:
          type: integer
          example: 1
  400:
    description: Invalid input
  404:
    description: Prescription not found
  500:
    description: Server error