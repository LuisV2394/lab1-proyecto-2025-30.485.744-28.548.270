tags:
  - Affiliations
summary: Get active affiliations for a person
description: >
  Retrieves all active affiliations for a specific person.
operationId: getPersonAffiliations

parameters:
  - name: personId
    in: path
    required: true
    description: ID of the person
    schema:
      type: integer
      example: 1234

responses:
  200:
    description: List of active affiliations
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
          personId:
            type: integer
          planId:
            type: integer
          policyNumber:
            type: string
          validFrom:
            type: string
            format: date
          validUntil:
            type: string
            format: date
          copayment:
            type: number
          deductible:
            type: number
          active:
            type: boolean

  404:
    description: Person not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Person not found"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Error interno del servidor"