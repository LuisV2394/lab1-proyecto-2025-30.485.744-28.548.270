tags:
- affiliations
summary: Get affiliation by ID
description: Retrieve affiliation details using the affiliation ID.
operationId: getAffiliationById
parameters:
- name: affiliation_id
  in: path
  required: true
  description: ID of the affiliation to retrieve.
  schema:
    type: integer
responses:
  200:
    description: Affiliation details retrieved successfully
    schema:
      type: object
      properties:
        affiliation_id:
          type: integer
          example: 9012
        person_id:
          type: integer
          example: 1234
        insurance_company_id:
          type: integer
          example: 5678
        coverage_plan: 
          type: string
          example: "Premium Plus"
        start_date:
          type: string
          format: date
          example: "2023-01-15"
        end_date:
          type: string
          format: date
          example: "2024-01-15"
  404:
    description: Affiliation not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Affiliation with ID 9012 not found."
  500:
    description: Internal server error