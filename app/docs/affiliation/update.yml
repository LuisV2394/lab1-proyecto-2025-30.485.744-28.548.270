tags:
  - Affiliations
summary: Update an affiliation
description: Updates an existing affiliation.
operationId: updateAffiliation
consumes:
  - application/json
produces:
  - application/json
parameters:
  - name: affiliation_id
    in: path
    required: true
    type: integer
    example: 1
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        payer_id:
          type: integer
          example: 2
        card_number:
          type: string
          example: "CARD-999999"
        policy_number:
          type: string
          example: "POL-999999"
        valid_from:
          type: string
          format: date
          example: "2024-02-01"
        valid_to:
          type: string
          format: date
          example: "2024-12-31"
        copayment:
          type: number
          example: 15.00
        coinsurance:
          type: number
          example: 7.50
        status:
          type: boolean
          example: true
responses:
  200:
    description: Affiliation updated successfully
  400:
    description: Invalid input
  404:
    description: Affiliation not found
  500:
    description: Server error