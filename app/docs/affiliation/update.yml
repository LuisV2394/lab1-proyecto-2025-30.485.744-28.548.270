tags:
  - Affiliations
summary: Update an affiliation
description: >
  Updates details of an existing affiliation. Validates foreign keys, dates, and policy number uniqueness.
operationId: updateAffiliation

parameters:
  - name: affiliationId
    in: path
    required: true
    description: ID of the affiliation to update
    schema:
      type: integer
      example: 9012
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        planId:
          type: integer
          description: New coverage plan ID
        policyNumber:
          type: string
          description: New policy number
        validFrom:
          type: string
          format: date
        validUntil:
          type: string
          format: date
        copayment:
          type: number
          format: float
        deductible:
          type: number
          format: float

responses:
  200:
    description: Affiliation updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Affiliation updated successfully"
        affiliation:
          type: object

  400:
    description: Validation error (invalid data)
    schema:
      type: object
      properties:
        error:
          type: string

  404:
    description: Affiliation or CoveragePlan not found
    schema:
      type: object
      properties:
        error:
          type: string

  409:
    description: Duplicate policy number
    schema:
      type: object
      properties:
        error:
          type: string
          example: "policyNumber ya existe"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Error interno del servidor"