tags:
  - Affiliations
summary: Get all affiliations
description: >
  Retrieves all affiliations in the system, both active and inactive.
operationId: getAllAffiliations

parameters: []

responses:
  200:
    description: List of all affiliations
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
          personId:
            type: integer
          planId:
            type: integer
          policyNumber:
            type: string
          validFrom:
            type: string
            format: date
          validUntil:
            type: string
            format: date
          copayment:
            type: number
            format: float
          deductible:
            type: number
            format: float
          active:
            type: boolean

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Error interno del servidor"