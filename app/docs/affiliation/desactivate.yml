tags:
- affiliations
summary: Deactivate an affiliation
description: Deactivate an existing affiliation instead of deleting it.
operationId: deactivateAffiliation

parameters:
- name: id
  in: path
  required: true
  description: ID of the affiliation to deactivate
  schema:
    type: integer

responses:
  200:
    description: Affiliation deactivated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Affiliation deactivated successfully"
  404:
    description: Affiliation not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Affiliation not found"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"