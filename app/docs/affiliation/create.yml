tags:
  - Affiliations
summary: Create a new affiliation
description: Creates a new affiliation between a person and a coverage plan.
operationId: createAffiliation
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        person_id:
          type: integer
          example: 1
        plan_id:
          type: integer
          example: 2
        payer_id:
          type: integer
          example: 1
        card_number:
          type: string
          example: "CARD-123456"
        policy_number:
          type: string
          example: "POL-789456"
        valid_from:
          type: string
          format: date
          example: "2024-01-01"
        valid_to:
          type: string
          format: date
          example: "2024-12-31"
        copayment:
          type: number
          format: float
          example: 10.00
        coinsurance:
          type: number
          format: float
          example: 5.00
        status:
          type: boolean
          example: true
      required:
        - person_id
        - plan_id
        - card_number
        - valid_from
responses:
  201:
    description: Affiliation created successfully
  400:
    description: Invalid input
  404:
    description: Related entity not found
  500:
    description: Server error