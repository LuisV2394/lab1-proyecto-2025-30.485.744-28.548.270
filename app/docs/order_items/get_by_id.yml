tags:
  - Order Items
summary: Get order item by ID
description: Retrieves a single order item by its ID.
operationId: getOrderItemById
produces:
  - application/json
parameters:
  - in: path
    name: order_item_id
    required: true
    type: integer
    example: 1
responses:
  200:
    description: Order item retrieved successfully
  404:
    description: Order item not found
  500:
    description: Server error