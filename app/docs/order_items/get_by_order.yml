tags:
  - Order Items
summary: Get order items by order
description: Retrieves all order items associated with a specific order.
operationId: getOrderItemsByOrder
produces:
  - application/json
parameters:
  - in: path
    name: order_id
    required: true
    type: integer
    example: 10
responses:
  200:
    description: Order items retrieved successfully
  404:
    description: Order not found
  500:
    description: Server error