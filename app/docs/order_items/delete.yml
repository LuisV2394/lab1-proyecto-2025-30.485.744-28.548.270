tags:
  - Order Items
summary: Delete an order item
description: Deletes an order item by its ID.
operationId: deleteOrderItem
produces:
  - application/json
parameters:
  - in: path
    name: order_item_id
    required: true
    type: integer
    example: 1
responses:
  200:
    description: Order item deleted successfully
  404:
    description: Order item not found
  500:
    description: Server error