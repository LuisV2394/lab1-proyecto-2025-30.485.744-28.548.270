tags:
  - Order Items
summary: Create a new order item
description: Creates a new order item associated with an existing order.
operationId: createOrderItem
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        order_id:
          type: integer
          example: 10
        prestation_code:
          type: string
          example: "LAB-CBC"
        instructions:
          type: string
          example: "Patient must be fasting"
        status:
          type: string
          example: "pending"
        result_id:
          type: integer
          example: 5
      required:
        - order_id
        - prestation_code
responses:
  201:
    description: Order item created successfully
  400:
    description: Missing or invalid input data
  404:
    description: Order not found
  500:
    description: Server error