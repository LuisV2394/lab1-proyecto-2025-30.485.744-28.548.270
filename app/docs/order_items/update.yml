tags:
  - order items
summary: Update order item status
description: Update status or result of an order item.
operationId: updateOrderItemStatus

consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: path
    name: item_id
    type: integer
    required: true
    description: ID of the order item
    example: 5

  - in: body
    name: body
    required: true
    description: Fields to update
    schema:
      type: object
      properties:
        status:
          type: string
          example: completed
        result_id:
          type: integer
          example: 20

responses:
  200:
    description: Order item updated successfully
    schema:
      type: object
      properties:
        id:
          type: integer
          example: 5
        status:
          type: string
          example: completed
        result_id:
          type: integer
          example: 20
  404:
    description: Item not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: Ítem not found
  500:
    description: Server error