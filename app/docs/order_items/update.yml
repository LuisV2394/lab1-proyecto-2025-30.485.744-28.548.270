tags:
  - Order Items
summary: Update an order item
description: Updates one or more fields of an existing order item.
operationId: updateOrderItem
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: order_item_id
    required: true
    type: integer
    example: 1
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        prestation_code:
          type: string
          example: "LAB-GLU"
        instructions:
          type: string
          example: "No fasting required"
        status:
          type: string
          example: "completed"
        result_id:
          type: integer
          example: 8
responses:
  200:
    description: Order item updated successfully
  404:
    description: Order item not found
  400:
    description: Invalid input
  500:
    description: Server error