tags:
  - Order Items
summary: Get all order items
description: Retrieves a list of all order items in the system.
operationId: getAllOrderItems
produces:
  - application/json
responses:
  200:
    description: Order items retrieved successfully
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          order_id:
            type: integer
            example: 10
          prestation_code:
            type: string
            example: "LAB-CBC"
          instructions:
            type: string
            example: "Patient must be fasting"
          status:
            type: string
            example: "pending"
          result_id:
            type: integer
            example: 5
          created_at:
            type: string
            example: "2025-01-05T14:30:00"
          updated_at:
            type: string
            example: "2025-01-05T15:10:00"
  500:
    description: Server error