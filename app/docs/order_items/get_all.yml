tags:
  - order items
summary: Get all order items
description: Retrieve all order items in the system.
operationId: getAllOrderItems

produces:
  - application/json

responses:
  200:
    description: List of order items
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          order_id:
            type: integer
            example: 10
          prestation_code:
            type: string
            example: LAB-001
          instructions:
            type: string
            example: Patient must fast for 8 hours
          status:
            type: string
            example: pending
          result_id:
            type: integer
            example: 20
  500:
    description: Server error