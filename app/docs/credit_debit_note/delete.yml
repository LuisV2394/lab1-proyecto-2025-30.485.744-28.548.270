tags:
  - Credit/Debit Notes
summary: Delete a credit/debit note
description: Deletes a credit/debit note by its ID.
operationId: deleteCreditDebitNote
parameters:
  - in: path
    name: note_id
    type: integer
    required: true
    description: ID of the note to delete
produces:
  - application/json
responses:
  200:
    description: Credit/Debit note deleted successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: Note deleted successfully
  404:
    description: Note not found
  500:
    description: Server error