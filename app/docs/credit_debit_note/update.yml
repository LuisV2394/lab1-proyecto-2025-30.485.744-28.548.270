tags:
  - Credit/Debit Notes
summary: Update an existing credit/debit note
description: Updates the amount or reason of an existing credit/debit note.
operationId: updateCreditDebitNote
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: note_id
    type: integer
    required: true
    description: ID of the note to update
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        amount:
          type: number
          format: float
        reason:
          type: string
responses:
  200:
    description: Credit/Debit note updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: Note updated successfully
        note_id:
          type: integer
  404:
    description: Note not found
  400:
    description: Invalid input
  500:
    description: Server error