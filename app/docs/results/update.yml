tags:
  - Results
summary: Update an existing result
description: Update summary or file of a result/acta and increment version.
operationId: updateResult
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: result_id
    type: integer
    required: true
    description: ID of the result to update
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        summary:
          type: string
          example: "Updated patient lab results"
        file_id:
          type: string
          example: "file_12346.pdf"
responses:
  200:
    description: Result updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Result updated successfully"
        result:
          type: object
          properties:
            id:
              type: integer
              example: 1
            order_id:
              type: integer
              example: 101
            summary:
              type: string
              example: "Updated patient lab results"
            file_id:
              type: string
              example: "file_12346.pdf"
            version:
              type: integer
              example: 2
            date:
              type: string
              format: date-time
              example: "2026-01-05T17:00:00"
            created_at:
              type: string
              format: date-time
              example: "2026-01-05T17:00:00"
            updated_at:
              type: string
              format: date-time
              example: "2026-01-05T17:10:00"
  400:
    description: Invalid input
  404:
    description: Result not found
  500:
    description: Server error