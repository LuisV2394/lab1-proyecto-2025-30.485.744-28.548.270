tags:
- results
summary: Create a new result
description: Endpoint to create a new result associated with a specific episode.
operationId: createResult

parameters:
- name: episode_id
  in: path
  required: true
  description: ID of the episode to associate the result with.
  schema:
    type: integer
- in: body
  name: body
  description: Result data
  required: true
  schema:
    type: object
    required:
      - test_name
      - result_value
      - unit
    properties:
      test_name:
        type: string
        description: Name of the test performed.
        example: "Blood Glucose"
      result_value:
        type: string
        description: Value of the test result.
        example: "95"
      unit:
        type: string
        description: Unit of measurement for the result.
        example: "mg/dL"
  
responses:
  201:
    description: Result created successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Result created successfully"
        result_id:
          type: integer
          example: 7890
  400:
    description: Invalid input
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Invalid input data"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"