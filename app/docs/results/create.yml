tags:
  - Results
summary: Create a new result
description: Create a new result/acta and attach a file if needed.
operationId: createResult
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        order_id:
          type: integer
          example: 101
        summary:
          type: string
          example: "Patient lab results normal"
        file_id:
          type: string
          example: "file_12345.pdf"
        date:
          type: string
          format: date
          example: "2026-01-05"
      required:
        - order_id
        - summary
responses:
  201:
    description: Result created successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Result created successfully"
        result:
          type: object
          properties:
            id:
              type: integer
              example: 1
            order_id:
              type: integer
              example: 101
            summary:
              type: string
              example: "Patient lab results normal"
            file_id:
              type: string
              example: "file_12345.pdf"
            version:
              type: integer
              example: 1
            date:
              type: string
              format: date-time
              example: "2026-01-05T17:00:00"
            created_at:
              type: string
              format: date-time
              example: "2026-01-05T17:00:00"
            updated_at:
              type: string
              format: date-time
              example: "2026-01-05T17:00:00"
  400:
    description: Invalid input
  404:
    description: Order not found
  500:
    description: Server error