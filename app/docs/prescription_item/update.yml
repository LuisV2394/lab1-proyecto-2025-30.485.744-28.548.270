tags:
  - Prescription Items
summary: Update a prescription item
description: Updates fields of an existing prescription item.
operationId: updatePrescriptionItem
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: item_id
    required: true
    type: integer
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        medicine_code:
          type: string
          example: "MED999"
        name:
          type: string
          example: "Ibuprofen"
        dosage:
          type: string
          example: "400mg"
        route:
          type: string
          example: "oral"
        frequency:
          type: string
          example: "BID"
        duration:
          type: string
          example: "7 days"
responses:
  200:
    description: Prescription item updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Prescription item updated successfully"
        item_id:
          type: integer
          example: 10
  400:
    description: Invalid input
  404:
    description: Prescription item not found
  500:
    description: Server error