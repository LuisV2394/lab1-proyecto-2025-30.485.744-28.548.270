tags:
  - Prescription Items
summary: Get all prescription items
description: Returns a list of all prescription items stored in the system.
operationId: getAllPrescriptionItems
produces:
  - application/json
responses:
  200:
    description: List of prescription items retrieved successfully
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 5
          prescription_id:
            type: integer
            example: 2
          medicine_code:
            type: string
            example: "MED123"
          name:
            type: string
            example: "Paracetamol"
          dosage:
            type: string
            example: "500mg"
          route:
            type: string
            example: "oral"
          frequency:
            type: string
            example: "TID"
          duration:
            type: string
            example: "5 days"
  500:
    description: Server error