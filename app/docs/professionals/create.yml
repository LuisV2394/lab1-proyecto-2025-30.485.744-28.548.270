tags:
  - Professionals
summary: Create a new professional
description: Creates a new professional record.
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        first_name:
          type: string
          example: "Luis"
          description: First name of the professional
        last_name:
          type: string
          example: "Daza"
          description: Last name of the professional
        professional_registry:
          type: string
          example: "REG-9087"
          description: Professional registry number
        specialty:
          type: string
          example: "Cardiología"
          description: Professional specialty
        email:
          type: string
          format: email
          example: "luis.daza@example.com"
          description: Email of the professional
        phone:
          type: string
          example: "+584121234567"
          description: Phone number of the professional
        status:
          type: string
          example: "ACTIVE"
          description: Status of the professional
        schedule_enabled:
          type: boolean
          example: true
          description: Whether the professional's schedule is enabled
      required:
        - first_name
        - last_name
        - professional_registry
        - specialty

responses:
  '201':
    description: Professional created successfully
    schema:
      type: object
      properties:
        message:
          type: string
        professional:
          type: object
          properties:
            id:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
            professional_registry:
              type: string
            specialty:
              type: string
            email:
              type: string
            phone:
              type: string
            status:
              type: string
            is_active:
              type: boolean
            schedule_enabled:
              type: boolean
  '400':
    description: Invalid data
    schema:
      type: object
      properties:
        error:
          type: string