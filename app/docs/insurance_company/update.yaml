tags:
- insurance_company
summary: Update Insurance Company
description: Update an existing insurance company by ID.
operationId: updateInsuranceCompany
parameters:
- name: insurance_company_id
  in: path
  description: ID of the insurance company to update
  required: true
  schema:
    type: integer
requestBody:
  description: Insurance company object that needs to be updated
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/InsuranceCompany'
responses:
  200:
    description: Insurance company updated successfully
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/InsuranceCompany'
  400:
    description: Invalid input
  500:
    description: Internal server error