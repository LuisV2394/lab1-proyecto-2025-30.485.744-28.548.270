tags:
  - insurance

summary: Create a new insurance record
description: Endpoint to create a new insurance record in the system.
operationId: createInsurance
parameters:
  - in: body
    name: insurance
    description: Insurance object that needs to be added
    required: true
    schema:
      type: object
      properties:
        provider:
          type: string
          example: "HealthCare Inc."
        policy_number:
          type: string
          example: "HC123456789"
        coverage_start_date:
          type: string
          format: date
          example: "2025-01-01"
        coverage_end_date:
          type: string
          format: date
          example: "2026-01-01"
        insured_person_id:
          type: string
          example: "28.548.270-5"
responses:
  '201':
    description: Insurance created successfully
    schema:
      type: object
      properties:
        id:
          type: string
          example: "ins_123456"
        provider:
          type: string
          example: "HealthCare Inc."
        policy_number:
          type: string
          example: "HC123456789"
        coverage_start_date:
          type: string
          format: date
          example: "2025-01-01"
        coverage_end_date:
          type: string
          format: date
          example: "2026-01-01"
        insured_person_id:
          type: string
          example: "28.548.270-5"
    201:
      description: Insurance created successfully
    400:
    description: Invalid input  
    500:    
    description: Server error