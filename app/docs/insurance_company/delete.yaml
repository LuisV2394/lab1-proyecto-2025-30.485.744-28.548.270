tags:
- insurance_company
summary: delete Insurance Company
description: Delete an insurance company by its ID.
operationId: deleteInsuranceCompany
produces:
- application/json
parameters:
- in: path
  name: insurance_company_id
  required: true  
  type: integer
  description: Insurance Company ID
  example: 10
responses:
  200:
    description: Insurance Company deleted successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Compañía de seguros eliminada"
  404:
    description: Insurance Company not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Compañía de seguros no encontrada"
  500:
    description: Server error 
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Internal server error"