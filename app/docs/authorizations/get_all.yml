tags:
- authorizations
summary: Get all authorizations
description: Retrieve a list of all authorization records.
operationId: getAllAuthorizations
produces:
- application/json

responses:
  200:
    description: List of authorizations
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 101
          patient_id:
            type: integer
            example: 1234
          professional_id:
            type: integer
            example: 5678
          service:
            type: string
            example: "Blood Test"
          status:
            type: string
            example: "Pending"
          created_at:
            type: string
            format: date-time
            example: "2026-01-05T12:34:56Z"
          updated_at:
            type: string
            format: date-time
            example: "2026-01-05T12:45:00Z"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"