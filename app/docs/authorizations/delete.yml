tags:
- authorizations
summary: Delete an authorization
description: Delete an existing authorization record by its ID.
operationId: deleteAuthorization
parameters:
- name: id
  in: path
  required: true
  description: ID of the authorization to delete
  schema:
    type: integer

responses:
  200:
    description: Authorization deleted successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Authorization deleted successfully"
  404:
    description: Authorization not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Authorization not found"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"