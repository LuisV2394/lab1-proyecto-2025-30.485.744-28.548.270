tags:
  - authorizations
summary: Get Authorization by ID
description: Endpoint to retrieve an authorization record by its ID.
operationId: getAuthorizationById
produces:
  - application/json
parameters:
  - name: authorizationId
    in: path
    description: ID of the authorization to retrieve
    required: true
    type: integer
responses:
  200:
    description: Successful retrieval of authorization
    schema:
      $ref: '#/definitions/Authorization'
  404:
    description: Authorization not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Authorization not found"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"