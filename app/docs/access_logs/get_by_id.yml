tags:
  - Access Logs
summary: Get access log by ID
description: Retrieves a single access log entry by its ID.
operationId: getAccessLogById
produces:
  - application/json
parameters:
  - name: id
    in: path
    required: true
    type: integer
    example: 22
responses:
  200:
    description: Log retrieved successfully
  404:
    description: Access log not found
  500:
    description: Server error