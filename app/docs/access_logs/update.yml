tags:
  - Access Logs
summary: Update access log entry
description: Updates an existing access log entry.
operationId: updateAccessLog
consumes:
  - application/json
produces:
  - application/json
parameters:
  - name: id
    in: path
    required: true
    type: integer
    example: 55
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        resource:
          type: string
          example: "/patients/4"
        action:
          type: string
          example: "PUT"
        details:
          type: string
          example: "Manual correction"
responses:
  200:
    description: Access log updated successfully
  400:
    description: Invalid input
  404:
    description: Access log not found
  500:
    description: Server error