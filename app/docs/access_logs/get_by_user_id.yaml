# get access log by user id
tags:
  - Access Logs
summary: Get access log entries by user ID
description: Retrieve access log entries for a specific user by their user ID.
parameters:
  - in: path
    name: user_id
    type: integer
    description: ID of the user whose access logs are to be retrieved
    required: true
responses:
  200:
    description: A list of access log entries for the specified user
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            description: ID of the access log entry
          user_id:
            type: integer
            description: ID of the user accessing the system
          action:
            type: string
            description: Description of the action performed
          timestamp:
            type: string
            format: date-time
            description: Timestamp of when the access log entry was created
  404:
    description: No access log entries found for the specified user ID.
    schema:
      type: object
      properties:
        error:
          type: string
          description: Error message detailing the issue
  500:
    description: Internal server error.
    schema:
      type: object
      properties:
        error:
          type: string
          description: Error message detailing the issue