tags:
  - Access Logs
summary: Get access logs
description: Retrieves access logs with optional pagination.
operationId: getAccessLogs
produces:
  - application/json
parameters:
  - name: page
    in: query
    type: integer
    required: false
    example: 1
    description: Page number
  - name: limit
    in: query
    type: integer
    required: false
    example: 50
    description: Number of items per page (max 500)
responses:
  200:
    description: Logs retrieved successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Logs retrieved successfully"
        total:
          type: integer
          example: 185
        page:
          type: integer
          example: 1
        logs:
          type: array
          items:
            type: object
  500:
    description: Server error