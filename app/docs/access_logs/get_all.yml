tags:
  - Access Logs
summary: Get all access logs
description: Returns a paginated list of access logs ordered by most recent first.
operationId: getAllAccessLogs
produces:
  - application/json
parameters:
  - name: page
    in: query
    required: false
    type: integer
    example: 1
  - name: limit
    in: query
    required: false
    type: integer
    example: 50
responses:
  200:
    description: Logs retrieved successfully
    schema:
      type: object
      properties:
        total:
          type: integer
          example: 120
        page:
          type: integer
          example: 1
        logs:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              user_id:
                type: integer
                example: 5
              resource:
                type: string
                example: "/patients/3"
              action:
                type: string
                example: "GET"
              details:
                type: string
                example: "Viewed patient details"
              ip_address:
                type: string
                example: "192.168.1.25"
              user_agent:
                type: string
                example: "Mozilla/5.0"
              date:
                type: string
                format: date-time
                example: "2026-01-08T14:22:31"
  401:
    description: Unauthorized
  403:
    description: Forbidden
  500:
    description: Server error