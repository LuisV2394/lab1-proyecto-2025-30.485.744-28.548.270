tags:
  - Access Logs
summary: Create access log entry
description: Creates a new access log entry manually.
operationId: createAccessLog
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        user_id:
          type: integer
          example: 4
          description: "Nullable. ID of the user related to this access event"
        resource:
          type: string
          example: "/patients/4"
        action:
          type: string
          example: "PUT"
        details:
          type: string
          example: "Updated patient information"
        date:
          type: string
          format: date-time
          example: "2026-01-09T14:30:00Z"
          description: "Optional. If not provided, current UTC time is used"
      required:
        - resource
        - action
responses:
  201:
    description: Access log created successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Access log created successfully"
        log:
          type: object
          properties:
            id:
              type: integer
              example: 55
            user_id:
              type: integer
              example: 4
            resource:
              type: string
              example: "/patients/4"
            action:
              type: string
              example: "PUT"
            ip_address:
              type: string
              example: "192.168.1.22"
            user_agent:
              type: string
              example: "Mozilla/5.0"
            details:
              type: string
              example: "Updated patient information"
            date:
              type: string
              format: date-time
              example: "2026-01-09T14:30:00Z"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
  400:
    description: Invalid input
  401:
    description: Unauthorized
  403:
    description: Forbidden
  500:
    description: Server error