tags:
  - Episodes
summary: Update episode data
description: Update type_episode or motivo of an existing episode (cannot close it)
operationId: updateEpisode
consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: path
    name: episode_id
    required: true
    type: integer
    description: ID of the episode to update
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        type_episode:
          type: string
          enum: ["CONSULTATION", "PROCEDURE", "CONTROL", "AMBULATORY_EMERGENCY"]
          example: "CONTROL"
        motivo:
          type: string
          example: "Follow-up after surgery"

responses:
  200:
    description: Episode updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Episodio actualizado"
        id:
          type: integer
          example: 77

  404:
    description: Episode not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Episodio no encontrado"