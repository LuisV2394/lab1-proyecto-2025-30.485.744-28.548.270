tags:
  - Episodes
summary: Close an episode
description: Marks an episode as closed and sets the closed_at timestamp
operationId: closeEpisode
parameters:
  - in: path
    name: episode_id
    required: true
    type: integer
    description: ID of the episode to close

responses:
  200:
    description: Episode closed successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Episodio cerrado exitosamente"

  404:
    description: Episode not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Episodio no encontrado"

  409:
    description: Episode already closed or pending orders exist
    schema:
      type: object
      properties:
        message:
          type: string
          example: "El episodio ya está cerrado"
        error:
          type: string
          example: "Existen órdenes pendientes"