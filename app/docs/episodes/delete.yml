tags:
  - Episodes
summary: Delete an episode
description: Deletes an episode record (administrative use)
operationId: deleteEpisode
parameters:
  - in: path
    name: episode_id
    required: true
    type: integer
    description: ID of the episode to delete

responses:
  200:
    description: Episode deleted successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Episodio eliminado"

  404:
    description: Episode not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Episodio no encontrado"