tags:
  - Episodes
summary: Get episode by ID
description: Retrieve a single episode by its ID
operationId: getEpisodeById
parameters:
  - in: path
    name: episode_id
    required: true
    type: integer
    description: ID of the episode

responses:
  200:
    description: Episode found
    schema:
      type: object
      properties:
        id:
          type: integer
        person_id:
          type: integer
        professional_id:
          type: integer
        unit_id:
          type: integer
        type_episode:
          type: string
        motivo:
          type: string
        status:
          type: string
        started_at:
          type: string
        closed_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

  404:
    description: Episode not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Episodio no encontrado"