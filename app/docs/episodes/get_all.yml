tags:
  - Episodes
summary: Get all episodes
description: Retrieve a list of all medical episodes
operationId: getAllEpisodes
produces:
  - application/json

responses:
  200:
    description: List of episodes
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
          person_id:
            type: integer
          professional_id:
            type: integer
          unit_id:
            type: integer
          type_episode:
            type: string
          motivo:
            type: string
          status:
            type: string
          started_at:
            type: string
          closed_at:
            type: string
          created_at:
            type: string
          updated_at:
            type: string