tags:
  - Invoices
summary: Update invoice status
description: Updates the status of a specific invoice.
operationId: updateInvoiceStatus
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: invoice_id
    type: integer
    required: true
    description: ID of the invoice to update
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - estado
      properties:
        estado:
          type: string
          enum: ["PENDING", "ISSUED", "PAID", "CANCELLED"]
          example: "ISSUED"
responses:
  200:
    description: Status updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Invoice status updated successfully"
        estado:
          type: string
          example: "ISSUED"
  400:
    description: Invalid input or cannot modify cancelled invoice
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Invalid estado. Allowed values: ['PENDING', 'ISSUED', 'PAID', 'CANCELLED']"
  404:
    description: Invoice not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Invoice not found"
  500:
    description: Database error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Database error details"