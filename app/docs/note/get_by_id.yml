tags:
  - Clinical Notes
summary: Get a clinical note by ID
description: Returns a single clinical note
operationId: getClinicalNoteById
produces:
  - application/json
parameters:
  - in: path
    name: id
    required: true
    type: integer
    description: ID of the clinical note
responses:
  200:
    description: Clinical note details
    schema:
      type: object
      properties:
        id:
          type: integer
        episode_id:
          type: integer
        professional_id:
          type: integer
        subjective:
          type: string
        objective:
          type: string
        assessment:
          type: string
        plan:
          type: string
        attachments:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  404:
    description: Clinical note not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: Clinical note not found