tags:
  - Clinical Notes
summary: Get all clinical notes
description: Returns a list of all clinical notes
operationId: getAllClinicalNotes
produces:
  - application/json
responses:
  200:
    description: List of clinical notes
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
          episode_id:
            type: integer
          professional_id:
            type: integer
          subjective:
            type: string
          objective:
            type: string
          assessment:
            type: string
          plan:
            type: string
          attachments:
            type: array
            items:
              type: string
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time