tags:
  - Clinical Notes
summary: Update a clinical note
description: Updates the fields of a clinical note. Notes of closed episodes cannot be modified.
operationId: updateClinicalNote
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: note_id
    required: true
    type: integer
    description: ID of the clinical note to update
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        subjective:
          type: string
        objective:
          type: string
        assessment:
          type: string
        plan:
          type: string
        attachments:
          type: array
          items:
            type: string
responses:
  200:
    description: Clinical note updated
    schema:
      type: object
      properties:
        message:
          type: string
          example: Clinical note updated
        id:
          type: integer
          example: 120
  404:
    description: Clinical note not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: Clinical note not found
  409:
    description: Cannot modify a note of a closed episode
    schema:
      type: object
      properties:
        error:
          type: string
          example: Cannot modify a note of a closed episode
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: Internal server error