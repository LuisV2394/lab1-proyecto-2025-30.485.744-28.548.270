tags:
  - Clinical Notes
summary: Create a clinical note
description: >
  Registers a new clinical note associated with an open episode.  
  Notes cannot be added to closed episodes.  
  At least one of the fields (`subjective`, `objective`, `assessment`, `plan`, `attachments`) must be provided.

operationId: createClinicalNote
consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - episode_id
        - professional_id
      properties:
        episode_id:
          type: integer
          description: "ID of the episode where the note is added"
          example: 55

        professional_id:
          type: integer
          description: "ID of the healthcare professional who writes the note"
          example: 9

        subjective:
          type: string
          description: "Subjective findings (S: Subjective)"
          example: "Patient reports abdominal pain for 3 days"

        objective:
          type: string
          description: "Objective findings (O: Objective)"
          example: "BP 120/80, HR 78, tenderness in lower right quadrant"

        assessment:
          type: string
          description: "Clinical analysis or assessment (A: Assessment)"
          example: "Suspected appendicitis"

        plan:
          type: string
          description: "Diagnostic or therapeutic plan (P: Plan)"
          example: "Request abdominal ultrasound and lab tests"

        attachments:
          type: array
          items:
            type: string
          description: "List of file URLs or identifiers attached to the note"
          example: ["file1.pdf", "image1.png"]

responses:
  201:
    description: Clinical note registered successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Clinical note registered"
        id:
          type: integer
          example: 120

  400:
    description: Invalid input or episode closed
    schema:
      type: object
      properties:
        error:
          type: string
          example: "At least one field must be provided: subjective, objective, assessment, plan, or attachments"

  404:
    description: Professional not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Professional not found"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"