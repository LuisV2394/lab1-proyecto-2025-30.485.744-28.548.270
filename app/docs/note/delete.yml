tags:
  - Clinical Notes
summary: Delete a clinical note
description: Deletes a clinical note. Notes of closed episodes cannot be deleted.
operationId: deleteClinicalNote
parameters:
  - in: path
    name: note_id
    required: true
    type: integer
    description: ID of the clinical note to delete
produces:
  - application/json
responses:
  200:
    description: Clinical note deleted
    schema:
      type: object
      properties:
        message:
          type: string
          example: Clinical note deleted
  404:
    description: Clinical note not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: Clinical note not found
  409:
    description: Cannot delete a note of a closed episode
    schema:
      type: object
      properties:
        error:
          type: string
          example: Cannot delete a note of a closed episode
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: Internal server error