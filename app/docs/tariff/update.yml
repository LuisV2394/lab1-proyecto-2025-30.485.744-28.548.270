tags:
  - Tariffs
summary: Update a tariff
description: Updates an existing tariff by its ID.
operationId: updateTariff
consumes:
  - application/json
produces:
  - application/json
parameters:
  - name: tariff_id
    in: path
    required: true
    type: integer
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        prestation_code:
          type: string
          example: "SRV001"
        plan_id:
          type: integer
          example: 1
        price:
          type: number
          format: float
          example: 160.0
        taxes:
          type: number
          format: float
          example: 16.0
        validFrom:
          type: string
          format: date
          example: "2026-01-08"
        validUntil:
          type: string
          format: date
          example: "2026-12-31"
responses:
  200:
    description: Tariff updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Tariff updated successfully"
        tariff:
          type: object
          properties:
            id:
              type: integer
              example: 1
            prestation_code:
              type: string
              example: "SRV001"
            plan_id:
              type: integer
              example: 1
            price:
              type: number
              format: float
              example: 160.0
            taxes:
              type: number
              format: float
              example: 16.0
            valid_from:
              type: string
              example: "2026-01-08"
            valid_until:
              type: string
              example: "2026-12-31"
  400:
    description: Invalid input, negative values, or duplicate tariff
  404:
    description: Tariff not found
  500:
    description: Server error