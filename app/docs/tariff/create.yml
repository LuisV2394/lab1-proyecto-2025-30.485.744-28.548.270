tags:
  - Tariffs
summary: Create a new tariff
description: Creates a new tariff for a service under a coverage plan.
operationId: createTariff
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        service_code:
          type: string
          example: "SRV001"
        plan_id:
          type: integer
          example: 1
        price:
          type: number
          format: float
          example: 150.0
        taxes:
          type: number
          format: float
          example: 15.0
        validFrom:
          type: string
          format: date
          example: "2026-01-08"
        validUntil:
          type: string
          format: date
          example: "2026-12-31"
      required:
        - service_code
        - plan_id
        - price
        - validFrom
responses:
  201:
    description: Tariff created successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Tariff created successfully"
        tariff:
          type: object
          properties:
            id:
              type: integer
              example: 1
            service_code:
              type: string
              example: "SRV001"
            plan_id:
              type: integer
              example: 1
            base_value:
              type: number
              format: float
              example: 150.0
            taxes:
              type: number
              format: float
              example: 15.0
            valid_from:
              type: string
              example: "2026-01-08"
            valid_until:
              type: string
              example: "2026-12-31"
  400:
    description: Invalid input or date format
  404:
    description: Service or coverage plan not found
  500:
    description: Server error