# update a tariff
---
tags:
  - Tariff
parameters:
  - name: tariff_id
    in: path
    required: true
    type: integer
    example: 1
  - name: body
    in: body
    required: true
    schema:
      properties:
        service_code:
          type: string
          example: "CUPS903895"
        plan_id:
          type: integer
          example: 1
        baseValue:
          type: number
          example: 50000.00
        taxes:
          type: number
          example: 0.00
        validFrom:
          type: string
          example: "2026-01-01"
        validUntil:
          type: string
          example: "2026-12-31"
responses:
  200:
    description: Tarifa actualizada exitosamente
  404:
    description: Tarifa, Servicio o Plan no encontrado