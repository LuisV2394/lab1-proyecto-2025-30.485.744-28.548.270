tags:
  - Tariffs
summary: Get all tariffs
description: Retrieve all tariffs, ordered by valid_from date descending.
operationId: getAllTariffs
produces:
  - application/json
responses:
  200:
    description: Tariffs retrieved successfully
    schema:
      type: object
      properties:
        count:
          type: integer
          example: 3
        tariffs:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              service_code:
                type: string
                example: "SRV001"
              plan_id:
                type: integer
                example: 1
              base_value:
                type: number
                format: float
                example: 150.0
              taxes:
                type: number
                format: float
                example: 15.0
              valid_from:
                type: string
                example: "2026-01-08"
              valid_until:
                type: string
                example: "2026-12-31"
  401:
    description: Unauthorized
  403:
    description: Forbidden
  500:
    description: Server error