tags:
  - Tariffs
summary: Get all tariffs
description: Retrieves all tariffs, ordered by valid_from descending.
operationId: getAllTariffs
produces:
  - application/json
responses:
  200:
    description: List of all tariffs
    schema:
      type: object
      properties:
        count:
          type: integer
          example: 2
        tariffs:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              prestation_code:
                type: string
                example: "SRV001"
              plan_id:
                type: integer
                example: 1
              price:
                type: number
                format: float
                example: 150.0
              taxes:
                type: number
                format: float
                example: 15.0
              valid_from:
                type: string
                example: "2026-01-08"
              valid_until:
                type: string
                example: "2026-12-31"
  500:
    description: Server error