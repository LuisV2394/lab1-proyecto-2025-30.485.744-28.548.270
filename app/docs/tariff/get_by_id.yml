tags:
  - Tariffs
summary: Get a tariff by ID
description: Retrieves a tariff by its ID.
operationId: getTariffById
produces:
  - application/json
parameters:
  - name: tariff_id
    in: path
    required: true
    type: integer
responses:
  200:
    description: Tariff retrieved successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Tariff retrieved successfully"
        tariff:
          type: object
          properties:
            id:
              type: integer
              example: 1
            service_code:
              type: string
              example: "SRV001"
            plan_id:
              type: integer
              example: 1
            base_value:
              type: number
              format: float
              example: 150.0
            taxes:
              type: number
              format: float
              example: 15.0
            valid_from:
              type: string
              example: "2026-01-08"
            valid_until:
              type: string
              example: "2026-12-31"
  404:
    description: Tariff not found
  401:
    description: Unauthorized
  403:
    description: Forbidden